<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HI3 Defender">
  <title>HI3 - The Galactic Defender</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=0.2">
</head>
<body>
  <div id="app">
    <div id="screen">
      <canvas id="game" width="240" height="320" aria-label="HI3 The Galactic Defender game screen"></canvas>
      <div class="crt" aria-hidden="true"></div>
    </div>
  </div>

  <div id="sys">
    <button id="btn-pause" type="button" aria-label="Pause">II</button>
    <button id="btn-mute" type="button" aria-label="Mute">&#9835;</button>
  </div>

  <div id="touch" aria-hidden="true">
    <div class="pad pad-left">
      <button id="btn-left" type="button" tabindex="-1">&#9664;</button>
      <button id="btn-right" type="button" tabindex="-1">&#9654;</button>
    </div>
    <div class="pad pad-right">
      <button id="btn-fire" type="button" tabindex="-1">FIRE</button>
    </div>
  </div>

  <div id="error" role="alert">
    <h1>GAME ERROR</h1>
    <p class="msg"></p>
    <p>Reload the page to restart.</p>
    <button type="button" onclick="location.reload()">RELOAD</button>
  </div>
  <noscript><p style="color:#3cf0ff;font-family:monospace;text-align:center">This game needs JavaScript enabled.</p></noscript>

  <script src="js/config.js?v=0.2"></script>
  <script src="js/sprites.js?v=0.2"></script>
  <script src="js/audio.js?v=0.2"></script>
  <script src="js/input.js?v=0.2"></script>
  <script src="js/effects.js?v=0.2"></script>
  <script src="js/projectiles.js?v=0.2"></script>
  <script src="js/player.js?v=0.2"></script>
  <script src="js/enemies.js?v=0.2"></script>
  <script src="js/levels.js?v=0.2"></script>
  <script src="js/ui.js?v=0.2"></script>
  <script src="js/game.js?v=0.2"></script>
</body>
</html>
